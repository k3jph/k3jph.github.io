# ===============================================================
# GitHub Actions Workflow — Build and Deploy Jekyll Site
# ===============================================================
# Builds with Ruby 3.4.2 and deploys automatically to GitHub Pages.

name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '00 21 * * *'
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ===============================================================
  # Build job
  # ===============================================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.2'   # matches Gemfile and .ruby-version
          bundler-cache: true
          cache-version: 0

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Nu HTML Checker
        uses: actions/cache@v4
        with:
          path: .validator-cache/vnu.jar
          key: vnu-${{ runner.os }}-b37a0a67cde28d6a3b361f4c774cbd80fe3e1fde38824304e295c8d764296756

      - name: Build Jekyll site
        run: |
          echo "==> Building Jekyll site in production mode"
          bundle exec rake build
        env:
          JEKYLL_ENV: production

      - name: Validate generated site
        run: bundle exec rake validate_links validate_html
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ===============================================================
  # Deployment job
  # ===============================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
