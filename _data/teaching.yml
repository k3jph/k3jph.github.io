      - code: "MATH 140"
        title: "Calculus I"
        description: "Calculus I is the traditional first semester of calculus. The course teaches limits and derivatives, with a focus on graphing. Finally, this course introduces the integral and sets up Calculus II."
        syllabi:
          - label: "Spring 2016 (OL2) Syllabus"
            file: "/assets/docs/MATH-140-Spring-2016-OL2.pdf"
      - code: "STAT 200"
        title: "Introduction to Statistics"
        description: "This is an introduction to applied statistics. Probability, t-tests, and [latex]\\chi^2[/latex]-tests are introduced. Application areas are broadly selected from across many different fields."
        syllabi:
          - label: "Spring 2024 (OL1) Syllabus"
