            file: "/assets/docs/STAT200-Syllabus-Fall-2017-OL1.pdf"
      - code: "STAT 230"
        title: "Introductory Business Statistics"
        description: "This is essentially the same as STAT 200, but the examples are drawn primarily from business settings and include production and finance problems. This class has since been discontinued in favor of STAT 200, above, as a generalized statistics course."
