      - code: "MATH 108"
        title: "Trigonometry and Analytical Geometry"
        description: "This course picks up where MATH 107 leaves off and adds trigonometric functions, analysis of triangles and other simple shapes. Some proofs are also introduced."
        syllabi:
          - label: "Fall 2015 (OL1) Syllabus"
            file: "/assets/docs/MATH-108-Fall-2015-OL1.pdf"
