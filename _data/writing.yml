series:
  - slug: history-of-artificial-intelligence
    title: A History of Artificial Intelligence
    description: Eleven essays tracing artificial intelligence from logic and relay circuits through expert systems, statistical learning, neural networks, transformers, and the present argument over what AI is for.
    posts:
      - route: /2026/04/29/when-machines-learned-to-choose/
        note: From Boolean logic and relay circuits to machines that could act on conditions.
      - route: /2026/05/06/when-the-theory-ran-ahead-of-the-world/
        note: Dartmouth, the perceptron, and the first ambitions of a named field.
      - route: /2026/05/13/the-first-winter/
        note: Why early promises outran hardware, data, and theory.
      - route: /2026/05/20/the-rule-based-interregnum/
        note: Expert systems made knowledge explicit—and exposed the cost of maintaining it.
      - route: /2026/06/04/the-second-winter/
        note: The commercial collapse that cleared the way for a different kind of AI.
      - route: /2026/06/10/simple-rules-surprising-worlds/
        note: Artificial life, emergence, and the discovery that complexity need not be designed.
      - route: /2026/06/25/let-the-data-decide/
        note: How statistical learning displaced hand-written rules.
      - route: /2026/06/25/neurons-all-the-way-down/
        note: Backpropagation, deep learning, and the return of connectionism.
      - route: /2026/07/01/attention-is-all-you-need/
        note: Transformers, language models, and the architecture behind the current boom.
      - route: /2026/07/16/the-naming-problem/
        note: Why successful AI so often stops being called AI.
      - route: /2026/07/22/what-we-do-now/
        note: What the field's seventy-year record suggests about governing the systems we have.

  - slug: mission-vision-and-values
    title: Mission, Vision, and Values
    description: A five-part practical sequence on what an organization does, why it does it, how it decides, and what comes next.
    posts:
      - route: /2015/08/31/mission-vision-and-values/
        note: Why the three statements are different and why an organization needs all three.
      - route: /2015/09/01/the-mission-statement/
        note: The present-tense statement of what an organization actually does.
      - route: /2015/09/02/the-vision-statement/
        note: The future condition the organization is trying to create.
      - route: /2015/09/03/the-values-statement/
        note: The decision framework that governs how the work gets done.
      - route: /2015/09/04/after-the-mission-vision-and-values/
        note: Goals, objectives, and the next layer of a usable strategic plan.

  - slug: policysplainer
    title: Policysplainer
    description: Two compact explainers that reduce large policy questions to mechanisms, scale, and numbers.
    posts:
      - route: /2016/06/16/terrorism-policysplainer/
        note: Putting the personal and public risk of terrorism into proportion.
      - route: /2019/05/07/social-security-policysplainer/
        note: How Social Security is financed, what it promises, and what its projections mean.
